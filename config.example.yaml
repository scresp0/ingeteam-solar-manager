# =============================================================================
# solar-manager — fichero de configuración
# Copia este fichero como config.yaml y rellena tus valores.
# Los campos marcados con [REQUERIDO] no tienen valor por defecto.
# =============================================================================

# -----------------------------------------------------------------------------
# Solcast — previsión de producción solar
# -----------------------------------------------------------------------------
solcast:
  api_key: "REQUERIDO"
  resource_id: "REQUERIDO"
  base_url: "https://api.solcast.com.au"
  forecast_hours: 48
  cache_ttl_hours: 4    # horas de validez de la caché local de Solcast

# -----------------------------------------------------------------------------
# Inversor Ingeteam INGECON SUN STORAGE 1PLAY TL-M
# -----------------------------------------------------------------------------
inverter:
  web_url: "http://REQUERIDO"
  username: "REQUERIDO"
  password: "REQUERIDO"
  modbus_host: ""           # si vacío, se usa la IP de web_url
  modbus_port: 502
  modbus_slave: 1
  browser_timeout_seconds: 30

# -----------------------------------------------------------------------------
# Instalación fotovoltaica
# -----------------------------------------------------------------------------
installation:
  battery_capacity_kwh: 10.0
  average_daily_consumption_kwh: 15.0
  peak_power_kwp: 5.0

# -----------------------------------------------------------------------------
# Tarifas eléctricas PVPC (peninsular)
#
# Estructura real del horario:
#
#   Lunes a jueves (laborables):
#     Valle  : 00:00 - 08:00
#     Llana  : 08:00 - 10:00  y  14:00 - 18:00  y  22:00 - 24:00
#     Punta  : 10:00 - 14:00  y  18:00 - 22:00
#
#   Viernes (laborable):
#     Valle  : 00:00 - 08:00
#     Llana  : 08:00 - 10:00  y  14:00 - 18:00  y  22:00 - 24:00
#     Punta  : 10:00 - 14:00  y  18:00 - 22:00
#
#   Sábado, domingo y festivos:
#     Valle  : 00:00 - 24:00  (todo el día)
#
# Cada periodo es una lista de intervalos {start, end}.
# El sistema usa esto para saber si en este momento hay que cargar (valle)
# y para calcular el schedule_at (hora de lanzar el script antes del valle).
# -----------------------------------------------------------------------------
tariff:
  # Hora de ejecución del ciclo nocturno (HH:MM)
  schedule_at: "23:55"

  # Re-evaluaciones adicionales (HH:MM) que recalculan la decisión con el SOC
  # del momento — que ya refleja el consumo y la producción solar reales — y
  # reconfiguran el inversor solo si difiere de lo ya programado. No escriben
  # ciclo_carga en InfluxDB ni leen stats. Varias horas separadas por coma.
  # Vacío o null = desactivado.
  #   "03:00" → capta el consumo nocturno real; queda margen hasta el fin
  #             del valle (08:00) para pasar de "no cargar" a "cargar".
  #   "19:00" → capta un día solar peor de lo previsto (lluvia, nubes) con
  #             5 h de antelación sobre el ciclo de las 23:55.
  # OJO a las horas de tarde: el algoritmo parte del SOC actual y solo descuenta
  # el consumo de 00:00–07:59, así que a las 19:00 el consumo de la tarde-noche
  # no se resta → decisión optimista. El ciclo de schedule_at sigue siendo el
  # canónico. Además, si hoy es fin de semana y se decide bloquear la descarga,
  # el bloqueo (Prog 2 = 6.3.2) pasa a aplicar YA, no a medianoche.
  schedule_recheck_at: "19:00, 03:00"

  # Hora límite de "madrugada" (0-12).
  # Si el programa se ejecuta ANTES de esta hora, actúa como si fuera
  # la noche del día anterior (cubre retrasos del scheduler o reinicios
  # accidentales en los primeros minutos del nuevo día).
  # Debe ser <= hora de fin del periodo valle (normalmente 8).
  night_cutoff_hour: 8

  weekend_days: [5, 6]
  holidays: []

  periods:
    valley:
      intervals:
        - { start: "00:00", end: "08:00" }
    flat:
      intervals:
        - { start: "08:00", end: "10:00" }
        - { start: "14:00", end: "18:00" }
        - { start: "22:00", end: "24:00" }
    peak:
      intervals:
        - { start: "10:00", end: "14:00" }
        - { start: "18:00", end: "22:00" }
# -----------------------------------------------------------------------------
# Lógica de carga de baterías
# -----------------------------------------------------------------------------
charging:
  risk_factor: 0.7
  min_soc_pct: 15
  max_soc_pct: 95
  safety_margin_kwh: 1.0
  # Consumo estimado en horario valle (00:00-08:00).
  # Actúa como fallback mientras no haya suficientes días históricos en InfluxDB.
  # window_days = periodo que se promedia. min_days_in_window = días con dato que
  # debe haber DENTRO de esa ventana para usar el valor dinámico (si no, fallback).
  # Invariante: window_days >= min_days_in_window. Ventana corta = más reactiva.
  night_consumption_kwh: 3.5
  night_consumption_window_days: 30        # periodo de la media (días)
  night_consumption_min_days_in_window: 14 # días con dato mínimos dentro de la ventana
  # Risk factor dinámico: calibrado desde histórico Solcast vs producción real.
  # Mientras no haya suficientes días, se usa el risk_factor fijo definido arriba.
  risk_factor_window_days: 30              # periodo del cálculo (días)
  risk_factor_min_days_in_window: 14       # pares (previsión+real) mínimos en la ventana
  # Factor de calibración del forecast Solcast (solar_real / forecast_p50 medio).
  # Compensa el sesgo sistemático del forecast para tu instalación concreta
  # (orientación, sombras, suciedad, AC vs DC, etc.). 1.0 = sin corrección.
  # Se calcula dinámicamente desde InfluxDB; el valor de aquí es fallback.
  # Clamp aplicado a [0.5, 1.5] como defensa ante muestras pequeñas o anómalas.
  solar_bias_factor: 1.0
  solar_bias_window_days: 30
  solar_bias_min_days_in_window: 14
  # Consumo diario dinámico: media de stats_diarias.consumption_kwh (24 h).
  # Calibra installation.average_daily_consumption_kwh, que pasa a ser solo el
  # fallback mientras no haya suficientes días. La ventana deslizante hace que el
  # valor siga la estación (verano con aire acondicionado vs invierno), en vez de
  # quedarse clavado en una media anual que no representa a ningún mes.
  daily_consumption_window_days: 30
  daily_consumption_min_days_in_window: 14

# -----------------------------------------------------------------------------
# Corriente máxima de carga (control dinámico para reducir calor)
# -----------------------------------------------------------------------------
# Ajusta la "Corriente Máxima de Carga" de la batería (1-66 A) al mínimo necesario
# para reducir el calor (calor ∝ corriente para una misma energía):
#  · SOLAR (08:00–fin de producción): corriente mínima que llena la batería simulando
#    el EXCEDENTE previsto franja a franja (producción p50 calibrada − consumo de la
#    vivienda). La batería carga a min(I·V, excedente): la corriente es un techo, no
#    un caudal garantizado, así que repartir la energía linealmente sobre las horas
#    restantes se quedaba corto (la producción es una campana) y el lazo lo corregía
#    tarde, subiendo a max_a al final de la tarde. Si ni max_a llena la batería, se
#    usa el pico de excedente previsto: por encima de él más amperios no captan más.
#    El consumo de la vivienda se mide del datalogger (ver house_power_window_min).
#    Con temp_gate_enabled=true, batería fría (temp ≤ hot_threshold_c) → max_a.
#  · VALLE (carga de red 00:00–08:00): corriente mínima para llegar al SOC objetivo en
#    lo que queda de valle.
#  · BALANCE (opcional): al alcanzar balance_soc_pct, carga lo más suave posible
#    (balance_floor_a) hasta max_soc_pct para balancear las celdas del stack,
#    siempre que dé tiempo antes de fin de ventana (solar o valle). Ignora la
#    puerta de temperatura.
#  · Sin carga (idle / batería llena) → no toca la corriente.
# Lectura por MODBUS (holding 40087), escritura por web (1.2).
charge_current:
  enabled: true
  interval_min: 15              # cada cuánto recalcula y, si procede, reescribe
  temp_gate_enabled: true       # true: SOLAR solo carga suave si temp > hot_threshold_c | false: carga suave siempre que la solar baste (ignora temperatura)
  hot_threshold_c: 30.0         # con temp_gate_enabled: batería fría (temp ≤ umbral) → max_a
  house_power_cache_min: 15     # minutos que se reutiliza la lectura de consumo (0 = sin caché).
                                # Cada lectura descarga el día COMPLETO del datalogger (~1 MB y
                                # creciendo), porque el endpoint no admite rangos. Con interval_min
                                # bajo eso son cientos de MB/día contra un equipo empotrado: con
                                # interval_min=3 y sin caché, ~480 descargas y ~450 MB/día.
                                # 15 min corta el 80% del tráfico sin perder reactividad (el SOC se
                                # sigue leyendo por MODBUS en cada tick, que es barato). Subirlo a 60
                                # no compensa: sumado a house_power_window_min, el dato efectivo
                                # pasaría a representar hasta 2 h atrás, justo lo que hace inútil la
                                # estimación cuando arranca el aire acondicionado.
  house_power_window_min: 60    # minutos del datalogger para estimar el consumo de la vivienda (mediana).
                                # Predictor de persistencia: lo consumido en la última hora es la mejor
                                # estimación de la próxima (el AC tiene inercia de horas). Mediana y no
                                # media para que un horno de 20 min no dispare la estimación. Si el
                                # datalogger no responde, cae a la media post-valle prorrateada.
  productive_window_pct: 90     # % del total diario real (fallback de fin de ventana si no hay forecast)
  productive_window_end_hour: 17.0  # fallback de fin de producción si no hay forecast ni histórico
  floor_a: 22                   # corriente mínima (para que la carga termine a tiempo)
  max_a: 66                     # tope máximo (66 = máximo del inversor)
  margin: 1.2                   # margen sobre el mínimo teórico
  battery_balance: false        # true: cerca del tope, carga muy suave para balancear celdas del stack
  balance_soc_pct: 97           # SOC a partir del cual entra el modo BALANCE (debe ser < charging.max_soc_pct)
  balance_soc_pct_2: 99         # 2ª etapa: SOC a partir del cual la corriente de balanceo baja a la mitad (>= balance_soc_pct)
  balance_floor_a: 12           # corriente mínima durante el balanceo (más baja que floor_a)

# -----------------------------------------------------------------------------
# Sistema
# -----------------------------------------------------------------------------
system:
  log_level: "INFO"
  log_file: "/app/logs/solar-manager.log"
  dry_run: false
  timezone: "Europe/Madrid"
  web_port: 8080
  web_enabled: true
  # Clave API para proteger los endpoints de escritura (POST /api/cycle, POST /api/run/{test}).
  # Vacío = sin autenticación (desarrollo / LAN de confianza).
  # Generar con: openssl rand -hex 16
  # Mejor definirla en .env como WEB_API_KEY en lugar de aquí.
  web_api_key: ""
  email:
    enabled: true          # true para activar notificaciones
    smtp_host: ""           # ej. smtp.gmail.com
    smtp_port: 587          # 587 = STARTTLS, 465 = SSL
    smtp_user: ""           # usuario SMTP (normalmente el email)
    smtp_password: ""       # contraseña SMTP (mejor en .env como SMTP_PASSWORD)
    mail_from: "solar-manager@tudominio.com"
    mail_to: "tu@email.com"
    use_tls: false           # STARTTLS (puerto 587)
    use_ssl: false          # SSL directo (puerto 465)

# -----------------------------------------------------------------------------
# InfluxDB — almacenamiento de series temporales
# -----------------------------------------------------------------------------
influxdb:
  enabled: true                 # true para activar
  url: "http://influxdb:8086"
  org: "solar"                   # INFLUXDB_ORG en .env
  bucket: "solar-manager"        # INFLUXDB_BUCKET en .env
  # token en .env como INFLUXDB_TOKEN

# -----------------------------------------------------------------------------
# Copia de seguridad externa por SCP
# -----------------------------------------------------------------------------
# Empaqueta la BD de InfluxDB + los logs + config.yaml en un .tar.gz y lo sube
# por SCP a un servidor remoto, rotando los backups antiguos. Autenticación por
# clave SSH (sin secretos en este fichero: la clave privada se monta en el
# contenedor). Requiere montar el volumen de la clave SSH en docker-compose.yml
# (ver ejemplo comentado) y que la clave pública esté en el authorized_keys del
# destino. También hay un botón "Backup a servidor" en la pestaña Configuración.
backup:
  enabled: false                # true para activar el backup automático diario
  schedule_at: "04:00"          # hora diaria (HH:MM) del backup automático
  host: "backup.example.com"    # servidor de destino
  port: 22
  user: "backup"                # usuario SSH en el destino
  remote_dir: "/srv/backups/solar-manager"   # directorio destino en el remoto
  ssh_key_path: "/root/.ssh/id_backup"       # clave privada montada en el contenedor
  # Verificación de la clave del host remoto. true (recomendado) exige el host en
  # known_hosts; ponlo en false solo para un primer arranque hasta poblarlo.
  strict_host_key_checking: true
  known_hosts_path: "/root/.ssh/known_hosts"
  retention: 7                  # nº de backups a mantener en el remoto (borra los más antiguos)
  timeout_seconds: 600          # timeout de scp/ssh
