<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>solar-manager</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
  body { background: #f8f9fa; }
  .status-card { min-height: 120px; }
  #log-output {
    background: #1e1e1e; color: #d4d4d4;
    font-family: monospace; font-size: 12px;
    height: 400px; overflow-y: auto;
    padding: 12px; border-radius: 6px;
    white-space: pre-wrap; word-break: break-all;
  }
  .badge-running { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .btn-test { min-width: 140px; }
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand">&#9728; solar-manager</span>
    <span class="navbar-text text-muted" id="clock"></span>
  </div>
</nav>

<div class="container-fluid px-4">

  <!-- Estado del inversor -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <strong>Estado del inversor</strong>
          <button class="btn btn-sm btn-outline-secondary" onclick="refreshStatus()">&#8635; Actualizar</button>
        </div>
        <div class="card-body">
          <div class="row g-3" id="status-cards">
            <div class="col text-center text-muted">Cargando...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tests y ciclo manual -->
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-header"><strong>Tests unitarios</strong></div>
        <div class="card-body d-flex flex-column gap-2">
          <button class="btn btn-outline-primary btn-test" onclick="runTest('inverter')">&#128268; Test inversor (MODBUS)</button>
          <button class="btn btn-outline-primary btn-test" onclick="runTest('solcast')">&#9728; Test Solcast</button>
          <button class="btn btn-outline-primary btn-test" onclick="runTest('decision')">&#129302; Test algoritmo</button>
          <button class="btn btn-outline-primary btn-test" onclick="runTest('config')">&#9881; Test configuración</button>
          <button class="btn btn-outline-warning btn-test" onclick="runTest('automation')">&#127760; Test automatización (dry)</button>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-header"><strong>Ciclo completo</strong></div>
        <div class="card-body d-flex flex-column gap-2">
          <button class="btn btn-warning btn-test" onclick="runCycle(true)">&#9654; Ciclo completo (dry run)</button>
          <button class="btn btn-danger btn-test" onclick="confirmCycle()">&#9888; Ciclo completo (REAL)</button>
          <small class="text-muted mt-2">El ciclo real modifica la configuración del inversor.</small>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-header"><strong>Estado de ejecución</strong></div>
        <div class="card-body">
          <div id="job-status" class="text-muted">Sin ejecución activa</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Log output -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <strong>Salida</strong>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-secondary" onclick="clearLog()">Limpiar</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="loadFileLogs()">&#128196; Ver log del sistema</button>
          </div>
        </div>
        <div class="card-body p-0">
          <div id="log-output">Pulsa un test para ver la salida aquí...</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// Reloj
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleString('es-ES');
}, 1000);

// Estado del inversor
async function refreshStatus() {
  const container = document.getElementById('status-cards');
  container.innerHTML = '<div class="col text-center text-muted">Cargando...</div>';
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    if (!d.ok) { container.innerHTML = `<div class="col text-danger">${d.error}</div>`; return; }
    const cards = [
      { label: 'Estado inversor', value: d.inverter_status, color: d.inverter_status === 'On-grid' ? 'success' : 'warning' },
      { label: 'Estado batería',  value: d.battery_status,  color: 'info' },
      { label: 'SOC',             value: d.soc_pct + ' %',  color: d.soc_pct > 50 ? 'success' : d.soc_pct > 20 ? 'warning' : 'danger' },
      { label: 'SOH',             value: d.soh_pct + ' %',  color: 'secondary' },
      { label: 'Potencia',        value: d.battery_power_w + ' W', color: 'secondary' },
      { label: 'Tensión',         value: d.battery_voltage_v + ' V', color: 'secondary' },
      { label: 'Temperatura',     value: d.battery_temp_c + ' ºC', color: 'secondary' },
    ];
    container.innerHTML = cards.map(c => `
      <div class="col-sm-6 col-md-3 col-lg-auto">
        <div class="card status-card text-center border-${c.color}">
          <div class="card-body py-2 px-3">
            <div class="text-muted small">${c.label}</div>
            <div class="fw-bold text-${c.color} fs-5">${c.value}</div>
          </div>
        </div>
      </div>`).join('');
  } catch(e) {
    container.innerHTML = `<div class="col text-danger">Error: ${e.message}</div>`;
  }
}

// Tests
async function runTest(name) {
  clearLog();
  setStatus('running', `Ejecutando test: ${name}...`);
  const r = await fetch(`/api/run/${name}`, { method: 'POST' });
  const { job_id } = await r.json();
  streamLogs(job_id);
}

async function runCycle(dryRun) {
  clearLog();
  setStatus('running', dryRun ? 'Ejecutando ciclo (dry run)...' : 'Ejecutando ciclo REAL...');
  const r = await fetch(`/api/cycle?dry_run=${dryRun}`, { method: 'POST' });
  const { job_id } = await r.json();
  streamLogs(job_id);
}

function confirmCycle() {
  if (confirm('¿Ejecutar el ciclo completo REAL?\nEsto modificará la configuración del inversor.')) {
    runCycle(false);
  }
}

// Stream de logs via SSE
function streamLogs(jobId) {
  const out = document.getElementById('log-output');
  const es = new EventSource(`/api/stream/${jobId}`);
  es.onmessage = (e) => {
    if (e.data.startsWith('__DONE__:')) {
      const status = e.data.split(':')[1];
      setStatus(status, status === 'ok' ? 'Completado correctamente' : 'Finalizado con errores');
      es.close();
      return;
    }
    out.textContent += e.data + '\n';
    out.scrollTop = out.scrollHeight;
  };
  es.onerror = () => {
    setStatus('error', 'Error en la conexión');
    es.close();
  };
}

// Log del fichero del sistema
async function loadFileLogs() {
  clearLog();
  const r = await fetch('/api/logs?lines=200');
  const { lines } = await r.json();
  const out = document.getElementById('log-output');
  out.textContent = lines.join('\n');
  out.scrollTop = out.scrollHeight;
}

function clearLog() {
  document.getElementById('log-output').textContent = '';
}

function setStatus(state, msg) {
  const el = document.getElementById('job-status');
  const colors = { running: 'warning', ok: 'success', error: 'danger' };
  const icons  = { running: '&#9654;', ok: '&#10003;', error: '&#10007;' };
  el.innerHTML = `<span class="badge bg-${colors[state] || 'secondary'} ${state === 'running' ? 'badge-running' : ''}">${icons[state] || ''} ${msg}</span>`;
}

// Cargar estado al inicio
refreshStatus();
setInterval(refreshStatus, 30000);
</script>
</body>
</html>
