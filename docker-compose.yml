# =============================================================================
# solar-manager docker-compose.yml
# =============================================================================

services:
  solar-manager:
    build: .
    container_name: solar-manager
    restart: unless-stopped

    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs

    env_file:
      - .env

    environment:
      - TZ=Europe/Madrid

    shm_size: '256mb'

    # En Linux network_mode: host permite llegar al inversor en red local
    # y hace innecesario el mapeo de puertos (el contenedor usa la red del host).
    # En Mac Docker Desktop no soporta host networking real, por lo que
    # el puerto hay que mapearlo explícitamente.
    # Para Mac: comentar network_mode y descomentar ports.
    # Para Linux: dejar network_mode y comentar ports.
    network_mode: host
    ports:
       - "8080:8080"

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
