# =============================================================================
# solar-manager docker-compose.yml
#
# Volúmenes Docker nombrados — persisten al mover el stack entre hosts:
#   solar-manager-logs     → logs de la aplicación
#   solar-manager-config   → config.yaml (editable sin reconstruir)
#   influxdb-data          → datos de InfluxDB
#   influxdb-config        → configuración de InfluxDB
#
# Para migrar a otro host:
#   docker volume export solar-manager-logs | ssh nuevo-host docker volume import -
# =============================================================================

services:
  solar-manager:
    build: .
    container_name: solar-manager
    restart: unless-stopped

    volumes:
      # config.yaml en volumen nombrado — portable entre hosts
      # Para actualizar: docker cp config.yaml solar-manager:/app/config.yaml
      - solar-manager-config:/app/config
      # Logs persistentes en volumen nombrado
      - solar-manager-logs:/app/logs

    env_file:
      - .env

    environment:
      - TZ=Europe/Madrid
      # Ruta del config dentro del contenedor
      - CONFIG_PATH=/app/config/config.yaml

    shm_size: '256mb'

    # En Linux network_mode: host permite llegar al inversor en red local.
    # En Mac: comentar network_mode y descomentar ports.
    network_mode: host
    # ports:
    #   - "8080:8080"

    depends_on:
      influxdb:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3

  influxdb:
    image: influxdb:2.7
    container_name: solar-manager-influxdb
    restart: unless-stopped

    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-solar}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-solar-manager}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
      - TZ=Europe/Madrid

    ports:
      - "8086:8086"

    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  solar-manager-config:
  solar-manager-logs:
  influxdb-data:
  influxdb-config:
