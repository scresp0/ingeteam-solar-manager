# =============================================================================
# solar-manager docker-compose.yml
# =============================================================================

services:
  solar-manager:
    build: .
    container_name: solar-manager
    restart: unless-stopped

    volumes:
      # rw (no :ro) — la pestaña Configuración de la web edita este fichero
      - ./config.yaml:/app/config.yaml
      - ./logs/:/app/logs
#      - solar-manager-logs:/app/logs
      # Clave SSH para el backup externo por SCP (sección `backup` de config.yaml).
      # Descomenta y coloca la clave privada en ./ssh/id_backup (+ known_hosts).
      # La ruta dentro del contenedor debe coincidir con backup.ssh_key_path.
#      - ./ssh:/root/.ssh:ro

    env_file:
      - .env

    environment:
      - TZ=Europe/Madrid
      - HOST_HOSTNAME=${HOST_HOSTNAME}

    shm_size: '256mb'

    # Limita el log de stdout que guarda Docker (json-file): sin esto crece sin fin.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"

    depends_on:
      influxdb:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3

  influxdb:
    image: influxdb:2.7
    container_name: solar-manager-influxdb
    restart: unless-stopped

    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2

    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-solar}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-solar-manager}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
      - TZ=Europe/Madrid

    ports:
      - "8086:8086"

    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Backup diario de InfluxDB a la NAS (scripts/backup_influxdb.sh): backup binario
  # + export line protocol, rotación GFS. Todo dentro del contenedor: el host no
  # programa nada (ni launchd ni systemd) ni monta la NAS. Log: `make logs-backup`;
  # backup inmediato: `make backup`. Detalle en ARCHITECTURE §9.6.
  backup:
    image: influxdb:2.7        # trae `influx` (backup por HTTP) e `influxd` (export-lp)
    container_name: solar-manager-backup
    restart: unless-stopped
    entrypoint: ["bash", "/backup.sh", "schedule"]

    environment:
      - TZ=Europe/Madrid
      - BACKUP_AT=23:57
      # Solo el token (no `env_file: .env`, que inyectaría todos los secretos)
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUX_ORG=${INFLUXDB_ORG:-solar}
      - INFLUX_BUCKET=${INFLUXDB_BUCKET:-solar-manager}

    volumes:
      - ./scripts/backup_influxdb.sh:/backup.sh:ro
      # export-lp lee el engine directamente: datos de InfluxDB en SOLO LECTURA
      - ./influxdb/data:/var/lib/influxdb2:ro
      - nas-backups:/nas

    depends_on:
      influxdb:
        condition: service_healthy

    # Unhealthy si el último backup diario de la NAS tiene más de 26 h
    healthcheck:
      test: ["CMD", "bash", "/backup.sh", "check"]
      interval: 10m
      timeout: 1m
      start_period: 15m
      retries: 1

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # NAS de backups (Synology, WriteOnce 2 h / 30 días). El export solo admite la IP
  # del host. ⚠️ Docker guarda estas opciones al CREAR el volumen: para cambiar de
  # NAS, `docker compose rm -sf backup && docker volume rm solar-manager_nas-backups`
  # y volver a levantar.
  nas-backups:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=numancia.metafrase.net,nfsvers=4"
      device: ":/volume4/APP-BACKUPS"
  solar-manager-logs:
  influxdb-data:
  influxdb-config:
