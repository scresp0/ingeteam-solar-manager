# =============================================================================
# solar-manager docker-compose.yml
# =============================================================================

services:
  solar-manager:
    build: .
    container_name: solar-manager
    restart: unless-stopped

    volumes:
      # rw (no :ro) — la pestaña Configuración de la web edita este fichero
      - ./config.yaml:/app/config.yaml
      - solar-manager-logs:/app/logs

    env_file:
      - .env

    environment:
      - TZ=Europe/Madrid
      - HOST_HOSTNAME=${HOST_HOSTNAME}

    shm_size: '256mb'

    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"

    depends_on:
      influxdb:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3

  influxdb:
    image: influxdb:2.7
    container_name: solar-manager-influxdb
    restart: unless-stopped

    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2

    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-solar}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-solar-manager}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
      - TZ=Europe/Madrid

    ports:
      - "8086:8086"

    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  solar-manager-logs:
  influxdb-data:
  influxdb-config:
